[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-agent"
version = "0.2.0"
description = "Educational S&P 500 research agent: price, news and fundamentals features with a baseline return-direction model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyarrow>=15",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
kaggle = ["kagglehub[pandas-datasets]>=0.3"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
