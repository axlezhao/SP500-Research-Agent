[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sp500-agent"
version = "0.4.0"
description = "S&P 500 research platform on free public data (Wikipedia, Yahoo Finance, SEC EDGAR, FRED): walk-forward ML, a portfolio backtest, and an LLM research agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyarrow>=15",
    "requests>=2.31",
    "lxml>=5",
    "yfinance>=0.2.50",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "altair>=5"]
llm = ["openai>=1.40", "anthropic>=1.0"]
kaggle = ["kagglehub[pandas-datasets]>=0.3"]
dev = ["pytest>=8"]

[project.scripts]
sp500-chat = "sp500_agent.llm_agent:main"
sp500-brief = "sp500_agent.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
